name: CI

# Branch protection should require exactly ONE status check: `summary`.
# `summary` needs every other job, runs with `if: always()`, and fails unless
# each dependency reported `success`. That way a job which is skipped by a
# paths filter (or never starts) still blocks the merge instead of silently
# leaving the gate green.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build the web app
        run: yarn workspace @humanvouch/web build

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build the AttestContract
        run: cargo build --manifest-path packages/contracts/attest/Cargo.toml

  summary:
    name: summary
    if: always()
    needs: [web, contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Summarise required jobs
        env:
          WEB_RESULT: ${{ needs.web.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
        run: |
          set -euo pipefail

          {
            echo "## CI summary"
            echo ""
            echo "| job | result |"
            echo "| --- | --- |"
            printf '| web | %s |\n' "$WEB_RESULT"
            printf '| contracts | %s |\n' "$CONTRACTS_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

          status=0
          for entry in "web:$WEB_RESULT" "contracts:$CONTRACTS_RESULT"; do
            job="${entry%%:*}"
            result="${entry##*:}"
            if [ "$result" != "success" ]; then
              echo "::error::Required job '$job' did not succeed (result: $result)"
              status=1
            fi
          done

          exit "$status"
