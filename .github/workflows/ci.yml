name: CI
on:
  pull_request: null
  schedule:
  - cron: 0 6 * * 1
  workflow_dispatch: null
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo registry and target
      uses: Swatinem/rust-cache@v2
    - name: Build the AttestContract
      run: cargo build --manifest-path packages/contracts/attest/Cargo.toml
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Cache cargo registry and target
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: packages/contracts
    - name: Check formatting (rustfmt)
      run: 'cargo fmt --check --manifest-path packages/contracts/attest/Cargo.toml

        cargo fmt --check --manifest-path packages/contracts/groth16-verifier/Cargo.toml

        cargo fmt --check --manifest-path packages/contracts/circom-to-soroban-hex/Cargo.toml

        '
    - name: Lint (clippy, warnings denied)
      run: 'cargo clippy --manifest-path packages/contracts/attest/Cargo.toml --all-targets
        -- -D warnings

        cargo clippy --manifest-path packages/contracts/groth16-verifier/Cargo.toml
        --all-targets -- -D warnings

        cargo clippy --manifest-path packages/contracts/circom-to-soroban-hex/Cargo.toml
        --all-targets -- -D warnings

        '
    - name: Build the contract workspace
      run: cargo build --manifest-path packages/contracts/Cargo.toml
  web-build:
    name: web (build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Enable Corepack
      run: corepack enable
    - run: yarn install --immutable
    - name: Build (turbo build -> @humanvouch/web nuxt build)
      run: yarn build
      env:
        VERCEL: '1'
    - name: Upload build output on failure
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: web-build-output
        path: 'packages/web/.vercel/output

          packages/web/.output

          '
        if-no-files-found: ignore
        retention-days: 7
  summary:
    name: summary
    if: always()
    needs:
    - web
    - contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Summarise required jobs
      env:
        WEB_RESULT: ${{ needs.web.result }}
        CONTRACTS_RESULT: ${{ needs.contracts.result }}
      run: "set -euo pipefail\n\n{\n  echo \"## CI summary\"\n  echo \"\"\n  echo\
        \ \"| job | result |\"\n  echo \"| --- | --- |\"\n  printf '| web | %s |\\\
        n' \"$WEB_RESULT\"\n  printf '| contracts | %s |\\n' \"$CONTRACTS_RESULT\"\
        \n} >> \"$GITHUB_STEP_SUMMARY\"\n\nstatus=0\nfor entry in \"web:$WEB_RESULT\"\
        \ \"contracts:$CONTRACTS_RESULT\"; do\n  job=\"${entry%%:*}\"\n  result=\"\
        ${entry##*:}\"\n  if [ \"$result\" != \"success\" ]; then\n    echo \"::error::Required\
        \ job '$job' did not succeed (result: $result)\"\n    status=1\n  fi\ndone\n\
        \nexit \"$status\"\n"
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Enable Corepack (Yarn 4)
      run: corepack enable
    - name: Install dependencies
      run: yarn install --immutable
    - name: Build the web app
      run: yarn workspace @humanvouch/web build
  registry-drift:
    name: registry-drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Enable Corepack (Yarn 4)
      run: corepack enable
    - name: Install dependencies
      run: yarn install --immutable
    - name: Regenerate the zk registry and check it is in sync
      run: node packages/zk/registry-drift.mjs
  vkey-check:
    name: vkey-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Validate committed verification key
      run: node packages/circuits/scripts/check-vkey.mjs
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Enable Corepack (Yarn 4)
      run: corepack enable
    - name: Install workspace dependencies
      run: yarn install --immutable
    - name: npm advisory audit
      run: yarn npm audit --all --recursive
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-audit
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit
    - name: Cargo advisory audit
      run: cargo audit --file packages/contracts/attest/Cargo.lock
  circuits:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
    - name: Enable Corepack
      run: corepack enable
    - name: Restore Yarn cache
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: yarn
    - run: yarn install --immutable
    - name: Install Circom 2.2.3
      run: "mkdir -p \"$RUNNER_TEMP/circom-bin\"\ncurl --fail --location --silent\
        \ --show-error \\\n  https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64\
        \ \\\n  --output \"$RUNNER_TEMP/circom-bin/circom\"\nprintf '%s  %s\\n' \\\
        \n  '85342c7ff332d948df7c0c50ecf201e6129349aef550ce873f3c811b79fe53a3' \\\n\
        \  \"$RUNNER_TEMP/circom-bin/circom\" | sha256sum --check --status\nchmod\
        \ +x \"$RUNNER_TEMP/circom-bin/circom\"\necho \"$RUNNER_TEMP/circom-bin\"\
        \ >> \"$GITHUB_PATH\"\n"
    - name: Test circuits
      run: yarn workspace @humanvouch/circuits test
  typecheck:
    name: web (typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: yarn
    - name: Install workspace deps
      run: yarn install --frozen-lockfile
    - name: Nuxt prepare
      run: yarn workspace @humanvouch/web run postinstall
    - name: Typecheck Nuxt app
      run: yarn workspace @humanvouch/web run typecheck
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: yarn
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install gitleaks 8.21.2
      run: "curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz\
        \ \\\n  | tar -xz -C \"$RUNNER_TEMP\" gitleaks\necho \"$RUNNER_TEMP\" >> \"\
        $GITHUB_PATH\"\n"
    - name: Scan full git history
      run: gitleaks git --config .gitleaks.toml --redact --verbose .
  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Enable Corepack
      run: corepack enable
    - name: Install with an immutable lockfile
      run: yarn install --immutable --mode=skip-build
    - name: Fail on lockfile drift
      run: git diff --exit-code yarn.lock
  size-gate:
    name: size-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Block oversized files
      env:
        BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha
          || github.event.before }}
      run: "if [ -z \"$BASE\" ] || [ \"$BASE\" = \"0000000000000000000000000000000000000000\"\
        \ ]; then\n  BASE=$(git hash-object -t tree /dev/null)\nfi\nscripts/size-gate.sh\
        \ \"$BASE\" HEAD\n"
permissions:
  contents: read
