name: CI
on:
  pull_request: null
  push:
    branches:
    - main
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo registry and target
      uses: Swatinem/rust-cache@v2
    - name: Build the AttestContract
      run: cargo build --manifest-path packages/contracts/attest/Cargo.toml
  web-build:
    name: web (build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Enable Corepack
      run: corepack enable
    - run: yarn install --immutable
    - name: Build (turbo build -> @humanvouch/web nuxt build)
      run: yarn build
      env:
        VERCEL: '1'
    - name: Upload build output on failure
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: web-build-output
        path: 'packages/web/.vercel/output

          packages/web/.output

          '
        if-no-files-found: ignore
        retention-days: 7
  summary:
    name: summary
    if: always()
    needs:
    - web
    - contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Summarise required jobs
      env:
        WEB_RESULT: ${{ needs.web.result }}
        CONTRACTS_RESULT: ${{ needs.contracts.result }}
      run: "set -euo pipefail\n\n{\n  echo \"## CI summary\"\n  echo \"\"\n  echo\
        \ \"| job | result |\"\n  echo \"| --- | --- |\"\n  printf '| web | %s |\\\
        n' \"$WEB_RESULT\"\n  printf '| contracts | %s |\\n' \"$CONTRACTS_RESULT\"\
        \n} >> \"$GITHUB_STEP_SUMMARY\"\n\nstatus=0\nfor entry in \"web:$WEB_RESULT\"\
        \ \"contracts:$CONTRACTS_RESULT\"; do\n  job=\"${entry%%:*}\"\n  result=\"\
        ${entry##*:}\"\n  if [ \"$result\" != \"success\" ]; then\n    echo \"::error::Required\
        \ job '$job' did not succeed (result: $result)\"\n    status=1\n  fi\ndone\n\
        \nexit \"$status\"\n"
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Enable Corepack (Yarn 4)
      run: corepack enable
    - name: Install dependencies
      run: yarn install --immutable
    - name: Build the web app
      run: yarn workspace @humanvouch/web build
permissions:
  contents: read
