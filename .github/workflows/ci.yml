name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/contracts

      - name: Check formatting (rustfmt)
        run: |
          cargo fmt --check --manifest-path packages/contracts/attest/Cargo.toml
          cargo fmt --check --manifest-path packages/contracts/groth16-verifier/Cargo.toml
          cargo fmt --check --manifest-path packages/contracts/circom-to-soroban-hex/Cargo.toml

      - name: Lint (clippy, warnings denied)
        run: |
          cargo clippy --manifest-path packages/contracts/attest/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path packages/contracts/groth16-verifier/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path packages/contracts/circom-to-soroban-hex/Cargo.toml --all-targets -- -D warnings
